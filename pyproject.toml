[project]
name = "STDF-Viewer"
version = "4.1.0"
description = "STDF Viewer is a free, fast and powerful GUI tool to visualize STDF files"
authors = [
    { name = "Noon Chen", email = "chennoon233@foxmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.4",
    "pydantic>=2.11.9",
    "pyqt5>=5.15.11",
    "pyqt5-qt5<=5.15.2; sys_platform == 'win32'", # 5.15.2 is latest to build on Windows, required for uv add compatability
    "pyqt5-qt5>=5.15.11; sys_platform != 'win32'",
    "pyqtgraph>=0.13.7",
    "tomlkit>=0.13.3",
    "xlsxwriter>=3.2.9",
    "rust_stdf_helper",
    "pillow>=13.0.0",
]

[tool.uv.sources]
rust_stdf_helper = { path = "./deps/rust_stdf_helper" }

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=9.2.0",
    # test read-back only: the runtime package renders through xlsxwriter
    "openpyxl>=3.1.5",
    "ruff>=0.15.0",
    "pylint>=3.3.0",
    "pyright>=1.1.400",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# ============================================
# Ruff — scoped to deps/exporter (fork-owned files only)
# ============================================
[tool.ruff]
include = ["deps/exporter/**/*.py"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# No pep8-naming (N): the package keeps the legacy camelCase identifiers
# mirrored from the upstream exporter API (user ruling 2026-11-14).
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"] # long lines owned by pylint C0301 (also disabled) — rendering tables need them

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ============================================
# Pylint — deps/exporter gate, adapted from the ProFiles template
# ============================================
[tool.pylint.MASTER]
max-line-length = 100
extension-pkg-allow-list = ["PyQt5"]
output-format = "colorized"
reports = false

[tool.pylint."MESSAGES CONTROL"]
# C0103: legacy camelCase identifiers kept by ruling — upstream API mirror
# C0301: line length handled by max-line-length/tables; ruff E501 also ignored
# R0801: deliberate small parallelism between sibling sheet/chart renderers
disable = "C0103,C0301,R0801"

[tool.pylint.DESIGN]
# Documented raises over the template defaults to admit the existing shape of
# the rendering functions (see deps/exporter/IDEAS.md for the refactor item).
max-args = 12
max-positional-arguments = 12
max-attributes = 15
max-locals = 40
max-branches = 15
max-statements = 70
max-returns = 10
max-module-lines = 1700
min-public-methods = 1 # mixins expose one public write* entry point

# ============================================
# Pyright — basic mode regression gate on deps/exporter (ProFiles template)
# ============================================
[tool.pyright]
include = ["deps/exporter"]
extraPaths = ["."]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
